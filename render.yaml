services:
  - type: web
    name: cricket-scorer-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Required ---
      # sync: false keeps these as secrets managed in the Render dashboard.
      # Render will create them with blank values; fill the real ones in once.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

      # --- Optional (safe defaults are provided by the code if unset) ---
      # PORT is injected automatically by Render for web services; do not override it.
      # Note: Do NOT set NODE_ENV=production in the blueprint env for a web service
      # that runs `npm install` during build, because it makes npm skip devDependencies
      # (the @types packages) and the TypeScript build fails.
      - key: CORS_ORIGIN
        sync: false
