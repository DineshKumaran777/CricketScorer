services:
  - type: web
    name: cricket-scorer-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Required ---
      # sync: false keeps these as secrets managed in the Render dashboard.
      # Render will create them with blank values; fill the real ones in once.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false

      # --- Optional (safe defaults are provided by the code if unset) ---
      # PORT is injected automatically by Render for web services; do not override it.
      # buildCommand uses `--include=dev` so devDependencies (@types) always install
      # even if NODE_ENV=production is set on the service.
      - key: CORS_ORIGIN
        sync: false
