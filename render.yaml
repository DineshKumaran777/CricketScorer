services:
  - type: web
    name: cricket-scorer-api
    runtime: node
    plan: free
    region: singapore
    rootDir: /
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # --- Required ---
      # sync: false keeps these as secrets managed in the Render dashboard.
      # Render will create them with blank values; fill the real ones in once.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

      # --- Optional (safe defaults are provided by the code if unset) ---
      # PORT is injected automatically by Render for web services; do not override it.
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://your-frontend-domain.com
        sync: false
